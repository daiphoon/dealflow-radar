name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_MODE: demo
      EXTERNAL_CALLS_ENABLED: "false"
      TRUSTED_SOURCE_CALLS_ENABLED: "false"
      PAID_API_CALLS_ENABLED: "false"
      AUTO_REFRESH_ENABLED: "false"
      AUTO_PUBLISH_ENABLED: "false"
      RUN_EXTERNAL_TESTS: "false"
      DATABASE_ADMIN_URL: postgresql+psycopg://demo_user:ci_owner_password@127.0.0.1:5432/equity_radar_ci
      DATABASE_URL: postgresql+psycopg://equity_app:ci_app_password@127.0.0.1:5432/equity_radar_ci
      APP_DATABASE_USER: equity_app
      APP_DATABASE_PASSWORD: ci_app_password
      POSTGRES_RLS_DATABASE_URL: postgresql+psycopg://equity_app:ci_app_password@127.0.0.1:5432/equity_radar_ci
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: equity_radar_ci
          POSTGRES_USER: demo_user
          POSTGRES_PASSWORD: ci_owner_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U demo_user -d equity_radar_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "20"

      - name: Pin supported npm audit client
        run: npm install --global npm@11.9.0 --no-audit --no-fund

      - name: Install backend dependencies
        run: uv sync --frozen --all-groups

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Audit frontend dependencies
        id: npm_audit
        working-directory: frontend
        run: |
          audit_report="${RUNNER_TEMP}/npm-audit.json"
          audit_error="${RUNNER_TEMP}/npm-audit.stderr"

          set +e
          npm audit --audit-level=high --json \
            --fetch-retries=2 \
            --fetch-retry-mintimeout=1000 \
            --fetch-retry-maxtimeout=5000 \
            --fetch-timeout=30000 \
            >"${audit_report}" 2>"${audit_error}"
          audit_exit=$?
          set -e

          cat "${audit_error}" >&2
          if [ "${audit_exit}" -eq 0 ]; then
            echo "fallback_required=false" >>"${GITHUB_OUTPUT}"
            exit 0
          fi

          if grep -q '"auditReportVersion"' "${audit_report}"; then
            cat "${audit_report}"
            echo "::error::npm audit found dependency vulnerabilities at or above the configured threshold."
            exit "${audit_exit}"
          fi

          if { cat "${audit_report}"; cat "${audit_error}"; } | \
            grep -Eiq 'network|timed? ?out|timeout|ECONNRESET|ECONNREFUSED|EAI_AGAIN|ENOTFOUND|50[234]|audit endpoint returned an error'; then
            echo "fallback_required=true" >>"${GITHUB_OUTPUT}"
            echo "::warning::npm audit is unavailable because of a transport or service error; running the independent OSV fallback."
            exit 0
          fi

          cat "${audit_report}"
          echo "::error::npm audit failed for an unclassified reason; refusing to fall back."
          exit "${audit_exit}"

      - name: Audit frontend dependencies with OSV fallback
        if: ${{ steps.npm_audit.outputs.fallback_required == 'true' }}
        uses: google/osv-scanner-action/osv-scanner-action@06b2ab4348248b456ee06c9e953637f55e03504f # v2.5.0
        with:
          scan-args: --lockfile=frontend/package-lock.json

      - name: Check backend style
        run: |
          uv run --frozen ruff check backend migrations scripts tests
          uv run --frozen ruff format --check backend migrations scripts tests

      - name: Verify SQLite migrations
        run: |
          sqlite_path="${RUNNER_TEMP}/dealflow-radar-ci.db"
          rm -f "${sqlite_path}"
          DATABASE_URL="sqlite:///${sqlite_path}" uv run --frozen alembic upgrade head
          DATABASE_URL="sqlite:///${sqlite_path}" uv run --frozen alembic check
          DATABASE_URL="sqlite:///${sqlite_path}" uv run --frozen alembic downgrade base

      - name: Prepare PostgreSQL RLS test database
        run: |
          DATABASE_URL="${DATABASE_ADMIN_URL}" uv run --frozen alembic upgrade head
          DATABASE_URL="${DATABASE_ADMIN_URL}" uv run --frozen alembic check
          DATABASE_URL="${DATABASE_ADMIN_URL}" uv run --frozen python -m scripts.seed_demo
          uv run --frozen python -m scripts.bootstrap_local_database

      - name: Run backend tests
        run: uv run --frozen pytest -q

      - name: Check and build frontend
        working-directory: frontend
        run: |
          npm test
          npm run typecheck
          npm run build

      - name: Validate production deployment configuration
        env:
          APP_MODE: production
          DATABASE_ADMIN_URL: postgresql+psycopg://m5_owner:m5_acceptance_owner_password@acceptance-db:5432/equity_radar
          DATABASE_URL: postgresql+psycopg://equity_app:m5_acceptance_app_password@acceptance-db:5432/equity_radar
          APP_DATABASE_USER: equity_app
          APP_DATABASE_PASSWORD: m5_acceptance_app_password
        run: |
          docker compose \
            --env-file deploy/acceptance.env.example \
            -f compose.production.yml \
            -f deploy/compose.acceptance.yml \
            config -q
          docker compose --profile tools --profile restore \
            --env-file deploy/single-host.env.example \
            -f compose.production.yml \
            -f deploy/compose.single-host.yml \
            config -q
          docker compose --profile tools --profile restore \
            --env-file deploy/single-host.env.example \
            -f compose.production.yml \
            -f deploy/compose.single-host.yml \
            config --format json | python -c \
              'import json,sys; config=json.load(sys.stdin); database=config["services"]["database"]; backup=config["services"]["backup"]; assert not database.get("ports"); assert set(database["networks"]) == {"app"}; assert backup["read_only"] is True; assert backup["cap_drop"] == ["ALL"]'

      - name: Build production container images
        env:
          APP_MODE: production
          DATABASE_ADMIN_URL: postgresql+psycopg://m5_owner:m5_acceptance_owner_password@acceptance-db:5432/equity_radar
          DATABASE_URL: postgresql+psycopg://equity_app:m5_acceptance_app_password@acceptance-db:5432/equity_radar
          APP_DATABASE_USER: equity_app
          APP_DATABASE_PASSWORD: m5_acceptance_app_password
        run: |
          docker compose \
            --env-file deploy/acceptance.env.example \
            -f compose.production.yml \
            -f deploy/compose.acceptance.yml \
            build api frontend
          docker compose \
            --env-file deploy/single-host.env.example \
            -f compose.production.yml \
            -f deploy/compose.single-host.yml \
            build backup
          docker compose \
            --env-file deploy/acceptance.env.example \
            -f compose.production.yml \
            -f deploy/compose.acceptance.yml \
            run --rm --no-deps preflight
