name: dealflow-radar-production

x-backend-environment: &backend-environment
  APP_MODE: ${APP_MODE:-production}
  DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
  AUTH_PROVIDER: ${AUTH_PROVIDER:-cloudbase}
  CLOUDBASE_ENV_ID: ${CLOUDBASE_ENV_ID:?CLOUDBASE_ENV_ID is required}
  CLOUDBASE_CLIENT_ID: ${CLOUDBASE_CLIENT_ID:-}
  CLOUDBASE_AUTH_TIMEOUT_SECONDS: ${CLOUDBASE_AUTH_TIMEOUT_SECONDS:-5}
  CLOUDBASE_AUTH_MAX_RESPONSE_BYTES: ${CLOUDBASE_AUTH_MAX_RESPONSE_BYTES:-64000}
  CLOUDBASE_AUTH_USER_AGENT: ${CLOUDBASE_AUTH_USER_AGENT:-DealflowRadarAuth/1.0}
  PHONE_LOGIN_ENABLED: ${PHONE_LOGIN_ENABLED:-false}
  AUTH_PHONE_CODE_COOLDOWN_SECONDS: ${AUTH_PHONE_CODE_COOLDOWN_SECONDS:-60}
  AUTH_PHONE_DAILY_LIMIT: ${AUTH_PHONE_DAILY_LIMIT:-5}
  AUTH_PHONE_ENV_DAILY_LIMIT: ${AUTH_PHONE_ENV_DAILY_LIMIT:-50}
  EXTERNAL_CALLS_ENABLED: ${EXTERNAL_CALLS_ENABLED:-false}
  PAID_API_CALLS_ENABLED: ${PAID_API_CALLS_ENABLED:-false}
  AUTO_REFRESH_ENABLED: ${AUTO_REFRESH_ENABLED:-false}
  RECENT_QUERY_TTL_DAYS: ${RECENT_QUERY_TTL_DAYS:-14}
  AUTO_PUBLISH_ENABLED: ${AUTO_PUBLISH_ENABLED:-false}
  TRUSTED_SOURCE_CALLS_ENABLED: ${TRUSTED_SOURCE_CALLS_ENABLED:-false}
  SOURCE_MONITOR_SCHEDULER_ENABLED: ${SOURCE_MONITOR_SCHEDULER_ENABLED:-false}
  WEB_RESEARCH_ENABLED: ${WEB_RESEARCH_ENABLED:-false}
  WEB_RESEARCH_CALLS_ENABLED: ${WEB_RESEARCH_CALLS_ENABLED:-false}
  INVESTOR_ANALYSIS_ENABLED: ${INVESTOR_ANALYSIS_ENABLED:-false}
  REVIEW_WORKBENCH_ENABLED: ${REVIEW_WORKBENCH_ENABLED:-false}
  TENDER_EVENTS_ENABLED: ${TENDER_EVENTS_ENABLED:-false}
  PERSONAL_MONTHLY_SEARCH_LIMIT: ${PERSONAL_MONTHLY_SEARCH_LIMIT:-100}
  PERSONAL_WATCHLIST_COMPANY_LIMIT: ${PERSONAL_WATCHLIST_COMPANY_LIMIT:-20}
  PERSONAL_MONTHLY_REPORT_LIMIT: ${PERSONAL_MONTHLY_REPORT_LIMIT:-10}
  PERSONAL_DAILY_REQUEST_LIMIT: ${PERSONAL_DAILY_REQUEST_LIMIT:-10}
  PERSONAL_MONTHLY_REQUEST_LIMIT: ${PERSONAL_MONTHLY_REQUEST_LIMIT:-30}
  PERSONAL_REQUEST_COOLDOWN_HOURS: ${PERSONAL_REQUEST_COOLDOWN_HOURS:-24}
  INVESTOR_ANALYSIS_POLICY_VERSION: ${INVESTOR_ANALYSIS_POLICY_VERSION:-investor-analysis-v1}
  INVESTOR_ANALYSIS_PROVIDER: ${INVESTOR_ANALYSIS_PROVIDER:-deepseek}
  INVESTOR_ANALYSIS_MODEL: ${INVESTOR_ANALYSIS_MODEL:-deepseek-v4-flash}
  INVESTOR_ANALYSIS_MIN_MATERIALITY: ${INVESTOR_ANALYSIS_MIN_MATERIALITY:-60}
  INVESTOR_ANALYSIS_MAX_INPUT_CHARACTERS: ${INVESTOR_ANALYSIS_MAX_INPUT_CHARACTERS:-12000}
  INVESTOR_ANALYSIS_MAX_OUTPUT_TOKENS: ${INVESTOR_ANALYSIS_MAX_OUTPUT_TOKENS:-1200}
  INVESTOR_ANALYSIS_MONTHLY_TOKEN_LIMIT: ${INVESTOR_ANALYSIS_MONTHLY_TOKEN_LIMIT:-500000}
  INVESTOR_ANALYSIS_TIMEOUT_SECONDS: ${INVESTOR_ANALYSIS_TIMEOUT_SECONDS:-30}
  INVESTOR_ANALYSIS_MAX_RESPONSE_BYTES: ${INVESTOR_ANALYSIS_MAX_RESPONSE_BYTES:-128000}
  INVESTOR_ANALYSIS_RETRY_LIMIT: ${INVESTOR_ANALYSIS_RETRY_LIMIT:-1}
  INVESTOR_ANALYSIS_WORKER_LEASE_SECONDS: ${INVESTOR_ANALYSIS_WORKER_LEASE_SECONDS:-300}
  INVESTOR_ANALYSIS_INPUT_COST_PER_MILLION_TOKENS: ${INVESTOR_ANALYSIS_INPUT_COST_PER_MILLION_TOKENS:-0}
  INVESTOR_ANALYSIS_OUTPUT_COST_PER_MILLION_TOKENS: ${INVESTOR_ANALYSIS_OUTPUT_COST_PER_MILLION_TOKENS:-0}
  WEB_RESEARCH_MATTERS_ENABLED: ${WEB_RESEARCH_MATTERS_ENABLED:-false}
  WEB_RESEARCH_EXTRACTION_ENABLED: ${WEB_RESEARCH_EXTRACTION_ENABLED:-false}
  WEB_RESEARCH_TAVILY_ENABLED: ${WEB_RESEARCH_TAVILY_ENABLED:-false}
  WEB_RESEARCH_TAVILY_ALLOWED_DOMAINS: ${WEB_RESEARCH_TAVILY_ALLOWED_DOMAINS:-}
  WEB_RESEARCH_EXTRACTION_MODEL: ${WEB_RESEARCH_EXTRACTION_MODEL:-}
  WEB_RESEARCH_MAX_MODEL_CALLS_PER_JOB: ${WEB_RESEARCH_MAX_MODEL_CALLS_PER_JOB:-3}
  WEB_RESEARCH_MAX_MODEL_INPUT_TOKENS: ${WEB_RESEARCH_MAX_MODEL_INPUT_TOKENS:-16000}
  WEB_RESEARCH_MAX_MODEL_OUTPUT_TOKENS: ${WEB_RESEARCH_MAX_MODEL_OUTPUT_TOKENS:-2000}
  WEB_RESEARCH_MODEL_INPUT_PRICE_PER_MILLION: ${WEB_RESEARCH_MODEL_INPUT_PRICE_PER_MILLION:-0}
  WEB_RESEARCH_MODEL_OUTPUT_PRICE_PER_MILLION: ${WEB_RESEARCH_MODEL_OUTPUT_PRICE_PER_MILLION:-0}
  WEB_RESEARCH_TAVILY_PRICE_PER_CALL: ${WEB_RESEARCH_TAVILY_PRICE_PER_CALL:-}
  WEB_RESEARCH_TAVILY_EXTRACT_PRICE_PER_CALL: ${WEB_RESEARCH_TAVILY_EXTRACT_PRICE_PER_CALL:-}
  WEB_RESEARCH_TOPIC_PLANNING_ENABLED: ${WEB_RESEARCH_TOPIC_PLANNING_ENABLED:-false}
  WEB_RESEARCH_INCREMENTAL_ENABLED: ${WEB_RESEARCH_INCREMENTAL_ENABLED:-false}
  WEB_RESEARCH_POLICY_VERSION: ${WEB_RESEARCH_POLICY_VERSION:-bounded-web-v3}
  WATCHLIST_MONITOR_ENABLED: ${WATCHLIST_MONITOR_ENABLED:-false}
  WATCHLIST_MONITOR_POLICY_VERSION: ${WATCHLIST_MONITOR_POLICY_VERSION:-watchlist-v1}
  WATCHLIST_MONITOR_INTERVAL_DAYS: ${WATCHLIST_MONITOR_INTERVAL_DAYS:-7}
  WATCHLIST_MONITOR_MAX_COMPANIES_PER_RUN: ${WATCHLIST_MONITOR_MAX_COMPANIES_PER_RUN:-5}
  WATCHLIST_MONITOR_COOLDOWN_HOURS: ${WATCHLIST_MONITOR_COOLDOWN_HOURS:-24}
  WATCHLIST_MONITOR_FAILURE_BACKOFF_MAX_DAYS: ${WATCHLIST_MONITOR_FAILURE_BACKOFF_MAX_DAYS:-30}
  WATCHLIST_MONITOR_NO_CHANGE_BACKOFF_AFTER: ${WATCHLIST_MONITOR_NO_CHANGE_BACKOFF_AFTER:-3}
  WATCHLIST_MONITOR_MAX_INTERVAL_DAYS: ${WATCHLIST_MONITOR_MAX_INTERVAL_DAYS:-30}
  WEB_RESEARCH_COST_VERSION: ${WEB_RESEARCH_COST_VERSION:-web-cost-v1}
  WEB_RESEARCH_BAIDU_PRICE_PER_CALL: ${WEB_RESEARCH_BAIDU_PRICE_PER_CALL:-}
  WEB_RESEARCH_BOCHA_PRICE_PER_CALL: ${WEB_RESEARCH_BOCHA_PRICE_PER_CALL:-}
  WEB_RESEARCH_UNKNOWN_PRICE_UPPER_BOUND: ${WEB_RESEARCH_UNKNOWN_PRICE_UPPER_BOUND:-}
  WEB_RESEARCH_TASK_LIMIT: ${WEB_RESEARCH_TASK_LIMIT:-0}
  WEB_RESEARCH_COMPANY_DAILY_LIMIT: ${WEB_RESEARCH_COMPANY_DAILY_LIMIT:-0}
  WEB_RESEARCH_COMPANY_WEEKLY_LIMIT: ${WEB_RESEARCH_COMPANY_WEEKLY_LIMIT:-0}
  WEB_RESEARCH_SYSTEM_WEEKLY_LIMIT: ${WEB_RESEARCH_SYSTEM_WEEKLY_LIMIT:-0}
  WEB_RESEARCH_SYSTEM_MONTHLY_LIMIT: ${WEB_RESEARCH_SYSTEM_MONTHLY_LIMIT:-0}
  WEB_RESEARCH_PRIMARY_PROVIDER: ${WEB_RESEARCH_PRIMARY_PROVIDER:-baidu}
  WEB_RESEARCH_FALLBACK_PROVIDER: ${WEB_RESEARCH_FALLBACK_PROVIDER:-bocha}
  WEB_RESEARCH_SEARCH_CACHE_TTL_DAYS: ${WEB_RESEARCH_SEARCH_CACHE_TTL_DAYS:-14}
  WEB_RESEARCH_DOCUMENT_CACHE_TTL_DAYS: ${WEB_RESEARCH_DOCUMENT_CACHE_TTL_DAYS:-14}
  WEB_RESEARCH_MAX_SEARCH_CALLS_PER_JOB: ${WEB_RESEARCH_MAX_SEARCH_CALLS_PER_JOB:-4}
  WEB_RESEARCH_MAX_RESULTS_PER_SEARCH: ${WEB_RESEARCH_MAX_RESULTS_PER_SEARCH:-10}
  WEB_RESEARCH_MAX_CANDIDATE_URLS: ${WEB_RESEARCH_MAX_CANDIDATE_URLS:-12}
  WEB_RESEARCH_MAX_DOCUMENTS_PER_JOB: ${WEB_RESEARCH_MAX_DOCUMENTS_PER_JOB:-3}
  WEB_RESEARCH_MAX_FETCH_REQUESTS_PER_JOB: ${WEB_RESEARCH_MAX_FETCH_REQUESTS_PER_JOB:-8}
  IDENTITY_MAX_SEARCH_CALLS: ${IDENTITY_MAX_SEARCH_CALLS:-6}
  IDENTITY_MAX_FETCH_REQUESTS: ${IDENTITY_MAX_FETCH_REQUESTS:-24}
  IDENTITY_MAX_DOWNLOAD_BYTES: ${IDENTITY_MAX_DOWNLOAD_BYTES:-4000000}
  WEB_RESEARCH_MAX_DOWNLOAD_BYTES_PER_JOB: ${WEB_RESEARCH_MAX_DOWNLOAD_BYTES_PER_JOB:-2000000}
  WEB_RESEARCH_MAX_RESPONSE_BYTES: ${WEB_RESEARCH_MAX_RESPONSE_BYTES:-500000}
  WEB_RESEARCH_MAX_ELAPSED_SECONDS: ${WEB_RESEARCH_MAX_ELAPSED_SECONDS:-180}
  WEB_RESEARCH_DAILY_SEARCH_CALL_LIMIT: ${WEB_RESEARCH_DAILY_SEARCH_CALL_LIMIT:-50}
  WEB_RESEARCH_MONTHLY_SEARCH_CALL_LIMIT: ${WEB_RESEARCH_MONTHLY_SEARCH_CALL_LIMIT:-1500}
  WEB_RESEARCH_TIMEOUT_SECONDS: ${WEB_RESEARCH_TIMEOUT_SECONDS:-15}
  WEB_RESEARCH_WORKER_LEASE_SECONDS: ${WEB_RESEARCH_WORKER_LEASE_SECONDS:-300}
  WEB_RESEARCH_FALLBACK_MIN_SUBJECT_RESULTS: ${WEB_RESEARCH_FALLBACK_MIN_SUBJECT_RESULTS:-1}

x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  api:
    <<: *service-defaults
    image: ${BACKEND_IMAGE:-dealflow-radar-backend:local}
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment: *backend-environment
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3).read()
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app

  frontend:
    <<: *service-defaults
    image: ${FRONTEND_IMAGE:-dealflow-radar-frontend:local}
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      API_BASE_URL: http://api:8000
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:?APP_PUBLIC_ORIGIN is required}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-cloudbase}
      PHONE_LOGIN_ENABLED: ${PHONE_LOGIN_ENABLED:-false}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/login').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      start_period: 15s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app

  investor-analysis-worker:
    image: ${BACKEND_IMAGE:-dealflow-radar-backend:local}
    profiles: ["analysis"]
    environment:
      <<: *backend-environment
      EXTERNAL_CALLS_ENABLED: ${INVESTOR_ANALYSIS_EXTERNAL_CALLS_ENABLED:-false}
      PAID_API_CALLS_ENABLED: ${INVESTOR_ANALYSIS_PAID_API_CALLS_ENABLED:-false}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      ANALYSIS_WORKER_USER_ID: ${ANALYSIS_WORKER_USER_ID:-}
      WORKER_TENANT_ID: ${WORKER_TENANT_ID:-}
    command: ["python", "-m", "scripts.run_investor_analysis_worker", "--drain"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app

  web-research-worker:
    image: ${BACKEND_IMAGE:-dealflow-radar-backend:local}
    profiles: ["web-research"]
    environment:
      <<: *backend-environment
      WEB_RESEARCH_ENABLED: ${WEB_RESEARCH_WORKER_ENABLED:-false}
      EXTERNAL_CALLS_ENABLED: ${WEB_RESEARCH_EXTERNAL_CALLS_ENABLED:-false}
      WEB_RESEARCH_CALLS_ENABLED: ${WEB_RESEARCH_WORKER_CALLS_ENABLED:-false}
      PAID_API_CALLS_ENABLED: ${WEB_RESEARCH_PAID_API_CALLS_ENABLED:-false}
      AUTO_REFRESH_ENABLED: "false"
      AUTO_PUBLISH_ENABLED: "false"
      TRUSTED_SOURCE_CALLS_ENABLED: "false"
      SOURCE_MONITOR_SCHEDULER_ENABLED: "false"
      INVESTOR_ANALYSIS_ENABLED: "false"
      BAIDU_SEARCH_API_KEY: ${BAIDU_SEARCH_API_KEY:-}
      BOCHA_SEARCH_API_KEY: ${BOCHA_SEARCH_API_KEY:-}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      WEB_RESEARCH_WORKER_USER_ID: ${WEB_RESEARCH_WORKER_USER_ID:-}
      WORKER_TENANT_ID: ${WORKER_TENANT_ID:-}
    command: ["python", "-m", "scripts.run_web_research_worker", "--drain"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - app

  proxy:
    <<: *service-defaults
    image: caddy:2.10.2-alpine
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    networks:
      - app

  preflight:
    image: ${BACKEND_IMAGE:-dealflow-radar-backend:local}
    profiles: ["tools"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      <<: *backend-environment
      SITE_ADDRESS: ${SITE_ADDRESS:?SITE_ADDRESS is required}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:?APP_PUBLIC_ORIGIN is required}
      ALLOW_INSECURE_LOCALHOST: ${ALLOW_INSECURE_LOCALHOST:-false}
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL is required}
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?BACKUP_DATABASE_URL is required}
      APP_DATABASE_USER: ${APP_DATABASE_USER:?APP_DATABASE_USER is required}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
    command: ["python", "-m", "scripts.check_production_config"]
    restart: "no"

  migrate:
    image: ${BACKEND_IMAGE:-dealflow-radar-backend:local}
    profiles: ["tools"]
    environment:
      <<: *backend-environment
      DATABASE_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL is required}
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    networks:
      - app

  bootstrap-role:
    image: ${BACKEND_IMAGE:-dealflow-radar-backend:local}
    profiles: ["tools"]
    environment:
      DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?DATABASE_ADMIN_URL is required}
      APP_DATABASE_USER: ${APP_DATABASE_USER:?APP_DATABASE_USER is required}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?APP_DATABASE_PASSWORD is required}
    command: ["python", "-m", "scripts.bootstrap_local_database"]
    restart: "no"
    networks:
      - app

  backup:
    image: postgres:16
    profiles: ["tools"]
    environment:
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:?BACKUP_DATABASE_URL is required}
      BACKUP_DIR: /backups
    volumes:
      - ${BACKUP_DIRECTORY:-./backups/deployment}:/backups
      - ./deploy/backup.sh:/usr/local/bin/dealflow-backup:ro
    command: ["/usr/local/bin/dealflow-backup"]
    restart: "no"
    networks:
      - app

  restore-test:
    image: postgres:16
    profiles: ["tools"]
    environment:
      RESTORE_TEST_DATABASE_URL: ${RESTORE_TEST_DATABASE_URL:?RESTORE_TEST_DATABASE_URL is required}
      BACKUP_FILE: ${BACKUP_FILE:-}
    volumes:
      - ${BACKUP_DIRECTORY:-./backups/deployment}:/backups:ro
      - ./deploy/restore-test.sh:/usr/local/bin/dealflow-restore-test:ro
    command: ["/usr/local/bin/dealflow-restore-test"]
    restart: "no"
    networks:
      - app

networks:
  app:

volumes:
  caddy_data:
  caddy_config:
